[project]
name = "locus-agent"
version = "0.1.0"
description = "Locus operasyon asistanı — LangGraph + deepagents"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langgraph",
    "langgraph-cli[inmem]>=0.4.30",
    "psycopg[binary]>=3.2",
    "sqlglot>=27",
    "httpx>=0.27",
    "deepagents>=0.7.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["evals"]
